<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="657" viewBox="0 0 1180 657" role="img" aria-label="IKEv1 Quick Mode 动画示意图">

<style><![CDATA[
  .bg { fill:#0b1220; } .panel { fill:#111d31; stroke:#31445e; stroke-width:1.5; }
  .edge { stroke:#39506b; stroke-width:1.5; fill:none; }
  .title { fill:#f8fafc; font:700 32px "Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif; }
  .sub { fill:#aebed3; font:400 17px "Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif; }
  .head { fill:#f1f5f9; font:700 22px "Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif; }
  .body { fill:#d4e3f5; font:400 19px "Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif; }
  .tiny { fill:#aebed3; font:400 15px "Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif; }
  .mono { fill:#e0edfb; font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace; }
  .cyan { fill:#67e8f9; } .green { fill:#5eead4; } .orange { fill:#fdba74; } .purple { fill:#c4b5fd; }
  .lineC { stroke:#22d3ee; stroke-width:3.5; fill:none; stroke-dasharray:12 8; animation:flow 1.2s linear infinite; }
  .lineG { stroke:#34d399; stroke-width:3.5; fill:none; stroke-dasharray:12 8; animation:flow 1.4s linear infinite; }
  .lineP { stroke:#a78bfa; stroke-width:3.5; fill:none; stroke-dasharray:12 8; animation:flow 1.6s linear infinite; }
  .pulse { animation:pulse 2.6s ease-in-out infinite; } .pulse2 { animation:pulse 3.2s ease-in-out infinite; }
  .glow { animation:glow 2.4s ease-in-out infinite; }
  @keyframes flow {to{stroke-dashoffset:-40}} @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
  @keyframes glow {0%,100%{filter:drop-shadow(0 0 1px #22d3ee)}50%{filter:drop-shadow(0 0 10px #22d3ee)}}
  @media (prefers-reduced-motion:reduce){.lineC,.lineG,.lineP,.pulse,.pulse2,.glow{animation:none}}
]]></style>
<rect class="bg" width="1180" height="657" rx="22"/>
<text x="42" y="55" class="title">Quick Mode 在协商什么？五类参数逐项匹配</text><text x="42" y="89" class="sub">协商的是业务数据安全关联（IPsec SA），不是重复第一阶段的网关身份认证</text><rect x="47" y="126" width="250" height="77" rx="14" fill="#132d43" stroke="#3b5e7b" stroke-width="1.5" /><text x="68" y="156" class="head">ESP 加密 / 完整性</text><text x="68" y="184" class="tiny">发起方提出</text><path d="M306 165 L396 165" class="lineC"/><circle r="5" fill="#67e8f9" opacity=".95"><animateMotion dur="2s" begin="0.0s" repeatCount="indefinite" path="M306 165 L396 165"/></circle><rect x="405" y="126" width="726" height="77" rx="14" fill="#102c30" stroke="#245b52" stroke-width="1.5" /><text x="424" y="157" class="body">AES-256 + HMAC-SHA256</text><text x="424" y="185" class="tiny">✓ 确认双方支持相同算法</text><rect x="47" y="220" width="250" height="77" rx="14" fill="#132d43" stroke="#3b5e7b" stroke-width="1.5" /><text x="68" y="250" class="head">模式</text><text x="68" y="278" class="tiny">发起方提出</text><path d="M306 259 L396 259" class="lineC"/><circle r="5" fill="#67e8f9" opacity=".95"><animateMotion dur="2s" begin="0.35s" repeatCount="indefinite" path="M306 259 L396 259"/></circle><rect x="405" y="220" width="726" height="77" rx="14" fill="#102c30" stroke="#245b52" stroke-width="1.5" /><text x="424" y="251" class="body">Tunnel Mode</text><text x="424" y="279" class="tiny">✓ 决定保护整个内部 IP 包</text><rect x="47" y="314" width="250" height="77" rx="14" fill="#132d43" stroke="#3b5e7b" stroke-width="1.5" /><text x="68" y="344" class="head">流量选择器</text><text x="68" y="372" class="tiny">发起方提出</text><path d="M306 353 L396 353" class="lineC"/><circle r="5" fill="#67e8f9" opacity=".95"><animateMotion dur="2s" begin="0.7s" repeatCount="indefinite" path="M306 353 L396 353"/></circle><rect x="405" y="314" width="726" height="77" rx="14" fill="#102c30" stroke="#245b52" stroke-width="1.5" /><text x="424" y="345" class="body">192.168.1.0/24 ⇄ 192.168.2.0/24</text><text x="424" y="373" class="tiny">✓ 定义哪些业务报文进入隧道</text><rect x="47" y="408" width="250" height="77" rx="14" fill="#132d43" stroke="#3b5e7b" stroke-width="1.5" /><text x="68" y="438" class="head">PFS（可选）</text><text x="68" y="466" class="tiny">发起方提出</text><path d="M306 447 L396 447" class="lineC"/><circle r="5" fill="#67e8f9" opacity=".95"><animateMotion dur="2s" begin="1.0499999999999998s" repeatCount="indefinite" path="M306 447 L396 447"/></circle><rect x="405" y="408" width="726" height="77" rx="14" fill="#102c30" stroke="#245b52" stroke-width="1.5" /><text x="424" y="439" class="body">Group 14</text><text x="424" y="467" class="tiny">✓ 启用时双方额外执行 DH</text><rect x="47" y="502" width="250" height="77" rx="14" fill="#132d43" stroke="#3b5e7b" stroke-width="1.5" /><text x="68" y="532" class="head">生命周期</text><text x="68" y="560" class="tiny">发起方提出</text><path d="M306 541 L396 541" class="lineC"/><circle r="5" fill="#67e8f9" opacity=".95"><animateMotion dur="2s" begin="1.4s" repeatCount="indefinite" path="M306 541 L396 541"/></circle><rect x="405" y="502" width="726" height="77" rx="14" fill="#102c30" stroke="#245b52" stroke-width="1.5" /><text x="424" y="533" class="body">3600 秒（示例）</text><text x="424" y="561" class="tiny">✓ 确定 SA 何时更新 / 过期</text><text x="64" y="623" class="sub">提示：策略 / 选择器 / PFS 不兼容时，第二阶段可能失败；生命周期差异未必直接导致失败。</text>
</svg>